<!DOCTYPE html>
<!--
  scripts.html: an external script, an inline script, a JSON-LD data block.
  With "Scripts" off (default): both scripts get type="text/plain"; the external one loses its src to
  data-scrapyard-src; inline script text and the JSON-LD block are kept as text/plain.
  With "Scripts" on: the external script becomes a data:text/javascript URI and both stay executable
  (the page shows "external ran" and "inline ran" when opened).
-->
<html>
<head>
    <meta charset="utf-8">
    <title>scripts fixture</title>
    <script type="application/ld+json">{"@type": "Article", "datePublished": "2024-05-06T10:00:00Z"}</script>
    <script src="/js/external.js"></script>
</head>
<body>
    <p id="out">no script ran</p>
    <script>document.getElementById("out").textContent += " / inline ran";</script>
</body>
</html>
