<!DOCTYPE html>
<!--
  harness.html: runs the content side of the capture engine (passes 1-3, packed sink) without the extension.
  The fixture named by ?page= (default css.html) is loaded into a same-origin iframe and captured with a mock port:
  frames are collected locally (same-origin frames only), the background fallback loader is unavailable.
      http://localhost:8080/harness.html?page=images.html[&mode=packed][&pretty=1][&shadow=1][&scripts=1]
  The result is shown in the right frame; window.__capture holds {result, html, manifest, error} for inspection.
-->
<html>
<head>
    <meta charset="utf-8">
    <title>capture harness</title>
    <style>
        body { margin: 0; font: 13px sans-serif; }
        #bar { padding: 6px; background: #eee; }
        #panes { display: flex; height: 70vh; }
        #panes iframe { flex: 1; border: 1px solid #999; }
        #log { white-space: pre-wrap; padding: 6px; height: 25vh; overflow: auto; font-family: monospace; }
    </style>
</head>
<body>
    <div id="bar">source (live) | capture (archive) <span id="status">running…</span></div>
    <div id="panes">
        <iframe id="source"></iframe>
        <iframe id="archive"></iframe>
    </div>
    <div id="log"></div>
    <script type="module" src="harness.js"></script>
</body>
</html>
