<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Notes</title>

    <link rel="stylesheet" type="text/css" href="../lib/quill/quill.snow.css" media="all"/>

    <link rel="stylesheet" type="text/css" href="../lib/org/org.css" media="all"/>
    <link rel="stylesheet" type="text/css" href="notes.css" media="all"/>

    <script type="text/javascript" src="../lib/jquery.js"></script>
    <script type="text/javascript" src="../lib/quill/quill.js"></script>

    <script type="text/javascript" src="../global.js"></script>
    <script type="module" src="notes.js"></script>
</head>
<body class="theme-vars">
    <div id="root-container">
        <div id="tabbar">
        </div>
        <div id="notes-error" style="display: none;"></div>
        <div id="content">
            <div id="notes-button-content" class="content">
                <div id="space-left"></div>
                <style id="notes-style"></style>
                <div id="notes" class="notes ql-editor"></div>
                <div id="space-right"></div>
            </div>
            <div id="edit-button-content" class="content">
                <div class="content-filler">
                    <nav id="format-rail" aria-label="Note format">
                        <div id="format-rail-title">Format</div>
                        <button type="button" class="format-button" data-format="delta" aria-pressed="true">
                            <span class="format-glyph">Aa</span>Rich text</button>
                        <button type="button" class="format-button" data-format="markdown" aria-pressed="false">
                            <span class="format-glyph">M&darr;</span>Markdown</button>
                        <button type="button" class="format-button" data-format="org" aria-pressed="false">
                            <span class="format-glyph">*</span>Org</button>
                        <button type="button" class="format-button" data-format="text" aria-pressed="false">
                            <span class="format-glyph">T</span>Plain text</button>
                        <div id="inserts">
                            <div class="format-rail-separator"></div>
                            <a href="#" id="insert-example">Example markup</a> <!--
                                |&nbsp;<a href="#" id="insert-style">EXAMPLE STYLE</a> -->
                        </div>
                    </nav>
                </div>
                <div id="editor-container">
                    <div id="wysiwyg-editor"></div>
                    <textarea id="editor"></textarea>
                </div>
                <div class="content-filler"></div>
            </div>
        </div>
        <div id="bottomline">
            <div id="align-selector">
                Align:
                <select id="notes-align">
                    <option value="right">Right</option>
                    <option value="left">Left</option>
                    <option value="center" selected>Center</option>
                </select>
                <div id="width-controls">
                    Width: <b id="decrease-width" class="width-button"></b>
                    <select id="notes-width">
                        <option value="default" selected>Default</option>
                        <option value="custom">Custom</option>
                        <option value="100%">100%</option>
                        <option value="50%">50%</option>
                        <option value="actual"></option>
                    </select>
                    <b id="increase-width" class="width-button"></b>
                </div>
                <div id="font-sizes">
                    <b id="font-size-smaller" class="font-button"></b>
                    <b id="font-size-default" class="font-button"></b>
                    <b id="font-size-larger" class="font-button"></b>
                </div>
            </div>
            <div id="editor-controls">
                <div id="editor-font-sizes">
                    <b id="editor-font-size-smaller" class="font-button"></b>
                    <b id="editor-font-size-default" class="font-button"></b>
                    <b id="editor-font-size-larger" class="font-button"></b>
                </div>
            </div>
            <div class="spacer">&nbsp;</div>
            <div id="save-info">
                <span id="save-hint" title="Press Ctrl+S while in the editor to save the notes immediately">?</span>
                <span id="save-time"></span>
            </div>
            <input type="button" id="close-button" value="Close">
        </div>
    </div>
</body>
</html>
